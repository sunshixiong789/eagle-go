name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 同一分支上新的推送会取消尚未完成的旧任务，避免排队浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"

jobs:
  proto:
    name: 契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking 需要历史提交做对比基准
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      # 工具从 tools module 编译到 bin/ 后在仓库根目录执行。
      # 用 `go -C tools tool buf` 会把工作目录切到 tools/，
      # buf.gen.yaml 里的 `directory: api` 会解析错。
      - name: 编译 buf
        run: go -C tools build -o "$PWD/bin/buf" github.com/bufbuild/buf/cmd/buf

      - name: buf lint
        run: ./bin/buf lint

      # PR 上拦截破坏性契约变更。契约是前后端共同依赖的公共接口，
      # 破坏性改动一旦合入，调用方要到运行时才会发现。
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: ./bin/buf breaking api --against ".git#branch=${{ github.base_ref }},subdir=api"

      # 生成代码必须与 proto 保持同步。不检查的话，
      # 改了 proto 却忘记重新生成的提交会一路合进主干。
      - name: 验证生成代码是最新的
        run: |
          make api config ent wire
          if ! git diff --exit-code; then
            echo "::error::生成代码不一致，请在本地运行 make generate 后提交"
            exit 1
          fi

  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      # 集成测试用 embedded-postgres 在进程内拉起真实 PostgreSQL，
      # 因此 CI 不需要声明 services，本地也不需要 Docker。
      # 缓存 PG 二进制，省掉每次约 100MB 的下载。
      - name: 缓存 embedded-postgres 二进制
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}

      - name: 构建
        run: make build

      - name: go vet
        run: |
          go vet ./...
          go -C tools vet ./...

      - name: 测试
        run: |
          mkdir -p coverage
          go test -race -coverprofile=coverage/eagle.out ./...
          go -C tools test ./...

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: golangci-lint
        run: make lint

  migrations:
    name: 迁移可回滚性
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eagle
          POSTGRES_PASSWORD: eagle
          POSTGRES_DB: eagle
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: 编译 goose
        run: go -C tools build -o "$PWD/bin/goose" github.com/pressly/goose/v3/cmd/goose

      # up 能跑通不代表 down 也能。回滚脚本平时没人执行，
      # 等到线上真要回滚时才发现写错，代价极高。
      - name: up -> down -> up 往返验证
        env:
          DSN: postgres://eagle:eagle@127.0.0.1:5432/eagle?sslmode=disable
        run: |
          ./bin/goose -dir migrations postgres "$DSN" up
          ./bin/goose -dir migrations postgres "$DSN" down-to 0
          ./bin/goose -dir migrations postgres "$DSN" up
          ./bin/goose -dir migrations postgres "$DSN" status
          ./bin/goose -dir migrations postgres "$DSN" down-to 0

  deployment:
    name: 部署清单检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose 解析
        run: make validate-deploy
