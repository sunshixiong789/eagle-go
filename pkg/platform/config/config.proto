syntax = "proto3";

package eagle.platform.config;

// 全部时长字段都用 Duration 而不是裸字符串/整数：类型在编译期就固定了单位，
// 不会出现「这个数字到底是秒还是毫秒」的歧义。
//
// 但 YAML 里只认「数字 + s」这一种写法，如 3600s、0.5s。
// Go 风格的 1h / 30m / 500ms 会在启动阶段解析失败，且报错信息只说
// invalid google.protobuf.Duration value，不指向具体是哪个字段——
// 这个坑真实踩过，见 configs/config.yaml 开头的说明
// 和 config_test.go 里挡住它的回归测试。
import "google/protobuf/duration.proto";

option go_package = "github.com/eagle-go/eagle/pkg/platform/config;config";

// Bootstrap 是配置文件的根消息，对应 configs/config.yaml 的顶层结构。
message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Observability observability = 4;


  // 5~9 是已删除能力的历史编号，不再复用。
  reserved 5, 6, 7, 8, 9;
}

// Server 是 HTTP 监听参数。
message Server {
  message HTTP {
    // 网络类型，如 tcp。留空即可——不设置时用 Kratos 的默认值，
    // 只有 unix socket 这类特殊场景才需要显式指定。
    string network = 1;
    // 监听地址，如 0.0.0.0:8000
    string addr = 2;
    // 单次请求的处理超时，本项目默认 5s
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  // 2 曾是 grpc；单体只对外暴露 HTTP。
  reserved 2;
  // Swagger 仅在开发环境显式启用；关闭时不注册文档路由。
  message Swagger {
    bool enabled = 1;
    // 文档页绝对路径，如 /swagger；不能占用业务接口前缀。
    string path = 2;
    // make api 生成的 OpenAPI 文件路径，相对于进程工作目录。
    string spec_file = 3;
  }
  Swagger swagger = 3;
}

message Data {
  message Database {
    // 数据库方言：postgres 或 mysql。留空时兼容为 postgres。
    string driver = 6;
    // 所选驱动的连接串；MySQL 必须启用 parseTime=true。
    string dsn = 1;
    // 连接池上限。开发环境 20 足够，生产按并发量调
    int32 max_conns = 2;
    // 连接池最多保留的空闲连接数。database/sql 不保证最小常驻连接数。
    int32 max_idle_conns = 3;
    // 单个连接的最长存活时间，到点后即使空闲也会被回收重建，
    // 避免连接长期存活后遇到的数据库侧超时/负载均衡漂移问题
    google.protobuf.Duration max_conn_lifetime = 4;
    // 连接空闲超过这个时长就会被释放，回收长期没人用的连接
    google.protobuf.Duration max_conn_idle_time = 5;
  }
  Database database = 1;
  reserved 2;
}

// 社会化登录与 Eagle token 签发配置。
message Auth {
  // Eagle token 的 issuer，必须与 token 里的 iss 完全一致。
  string issuer = 1;
  // Eagle API 的 audience。
  string audience = 3;
  // 已删除的历史认证兼容、角色绕过和 HS256 共享密钥配置，不再复用编号。
  reserved 2, 4, 5, 6, 7, 8, 9, 10, 11;

  google.protobuf.Duration access_token_ttl = 12;
  google.protobuf.Duration refresh_token_ttl = 13;

  message SocialProvider {
    bool enabled = 1;
    // Google OAuth Client ID 或 Apple Services ID / Bundle ID。
    string client_id = 2;
  }
  SocialProvider google = 14;
  SocialProvider apple = 15;

  // 目录内每个 <kid>.pem 是一把 ES256/RS256 私钥或公钥；只有 active
  // 对应的文件必须包含私钥。保留旧公钥即可让轮换期间的存量 token 继续验签。
  string signing_key_directory = 16;
  string active_signing_key_id = 17;
}

message Observability {
  // OTLP gRPC 端点，如 127.0.0.1:4317。留空则不上报链路
  string otlp_endpoint = 1;
  // 采样率 0.0~1.0。生产环境建议 0.01~0.1
  double trace_sample_ratio = 2;
  // debug / info / warn / error
  string log_level = 3;
  // Prometheus 指标暴露地址，如 0.0.0.0:9100
  string metrics_addr = 4;
  // 集群内明文 OTLP 显式设为 true；跨网络保持 false，使用系统 TLS 根证书。
  bool otlp_insecure = 5;
}
