syntax = "proto3";

package eagle.system.v1;

option go_package = "github.com/eagle-go/eagle/api/eagle/system/v1;systemv1";

// 业务错误原因。与 HTTP/gRPC 状态码解耦：状态码表达「哪一类错误」，
// reason 表达「具体是什么」，客户端按 reason 做分支处理。
//
// 用法（沿用官方 kratos-layout 的做法，不引 protoc-gen-go-errors）：
//   errors.NotFound(v1.ErrorReason_ERROR_REASON_PERMISSION_NOT_FOUND.String(), "权限不存在")
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;

  // 权限节点
  ERROR_REASON_PERMISSION_NOT_FOUND = 20;
  ERROR_REASON_PERMISSION_CODE_DUPLICATED = 21;
  // 存在子节点时不允许删除
  ERROR_REASON_PERMISSION_HAS_CHILDREN = 22;
  // parent_id 指向自身或其后代，会形成环
  ERROR_REASON_PERMISSION_CYCLE = 23;
  // 客户端基于旧 revision 修改，数据已被其他管理员更新
  ERROR_REASON_CONCURRENT_MODIFICATION = 24;
  // 权限码格式不合法
  ERROR_REASON_INVALID_PERMISSION_CODE = 25;
  // 按钮型节点缺少权限码
  ERROR_REASON_BUTTON_REQUIRES_CODE = 26;
  // 节点类型取值越界
  ERROR_REASON_INVALID_PERMISSION_TYPE = 27;
  // 节点名为空
  ERROR_REASON_EMPTY_PERMISSION_NAME = 28;

  // 字典
  ERROR_REASON_DICT_TYPE_NOT_FOUND = 30;
  ERROR_REASON_DICT_TYPE_DUPLICATED = 31;
  ERROR_REASON_DICT_DATA_NOT_FOUND = 32;
  ERROR_REASON_DICT_DATA_DUPLICATED = 33;

  // 角色权限绑定
  ERROR_REASON_ROLE_NOT_BOUND = 40;
  // 引用了权限目录中不存在的权限码，多半是拼写错误
  ERROR_REASON_UNKNOWN_PERMISSION_CODE = 41;
  // 角色继承出现自继承或闭环
  ERROR_REASON_ROLE_INHERITANCE_CYCLE = 42;
  // 角色名为空
  ERROR_REASON_EMPTY_ROLE = 43;
}
