syntax = "proto3";

package eagle.system.v1;

import "buf/validate/validate.proto";
import "eagle/annotations/v1/perm.proto";

option go_package = "github.com/eagle-go/eagle/api/eagle/system/v1;systemv1";

// InternalUserService 只供 auth 服务通过 gRPC 调用，不绑定任何 HTTP 路由。
//
// 调用方持 client_credentials 换来的服务令牌，authz 中间件把令牌 scope
// 映射成权限码后按同一套规则判定——内部接口不走"信任内网"的裸奔路线。
service InternalUserService {
  // 校验账密。密码哈希不出 system 服务：auth 把明文口令送进来验，
  // 而不是把 password_hash 取回去自己比对，缩小哈希的暴露面。
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse) {
    option (eagle.annotations.v1.perm) = "internal:auth:verify";
  }

  // 取用户的角色码与权限码，用于签发 token 和填充权限缓存
  rpc GetUserAuthInfo(GetUserAuthInfoRequest) returns (GetUserAuthInfoResponse) {
    option (eagle.annotations.v1.perm) = "internal:auth:read";
  }

  rpc TouchLastLogin(TouchLastLoginRequest) returns (TouchLastLoginResponse) {
    option (eagle.annotations.v1.perm) = "internal:auth:write";
  }
}

message VerifyCredentialsRequest {
  string username = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message VerifyCredentialsResponse {
  // 账密是否匹配。为 false 时不区分"用户不存在"和"密码错误"，避免账号枚举。
  bool ok = 1;
  int64 user_id = 2;
  string username = 3;
  string nickname = 4;
  // 0=禁用 1=正常。ok=true 但 status=0 时，调用方应拒绝登录并给出账号停用提示。
  int32 status = 5;
}

message GetUserAuthInfoRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}

message GetUserAuthInfoResponse {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  int32 status = 5;
  repeated string role_codes = 6;
  repeated string permission_codes = 7;
}

message TouchLastLoginRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0];
}

message TouchLastLoginResponse {}
