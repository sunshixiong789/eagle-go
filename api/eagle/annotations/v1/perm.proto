syntax = "proto3";

package eagle.annotations.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/eagle-go/eagle/api/eagle/annotations/v1;annotationsv1";

// AccessLevel 强制每个 RPC 显式选择访问语义，避免“忘记写权限注解”与
// “有意只要求登录”都表现成空值而无法区分。
enum AccessLevel {
  ACCESS_LEVEL_UNSPECIFIED = 0;
  ACCESS_LEVEL_PUBLIC = 1;
  ACCESS_LEVEL_AUTHENTICATED = 2;
  ACCESS_LEVEL_PERMISSION_REQUIRED = 3;

}

// 方法级权限声明。
//
// 权限要求写在契约里而不是散在 handler 中：pkg/authz 中间件在运行时
// 从方法描述符读出这些扩展，业务代码不出现鉴权分支。
//
//   rpc CreateUser (CreateUserRequest) returns (CreateUserResponse) {
//     option (eagle.annotations.v1.perm) = "system:dict:add";
//   }
//
// 字段号取 50000-99999 区间，该区间由 protobuf 保留给组织内部扩展使用。
extend google.protobuf.MethodOptions {
  // 调用该方法所需的权限码，例如 "system:dict:add"。
  // 留空表示只校验登录态、不校验具体权限。
  string perm = 50001;

  // RPC 的显式访问级别。每个接口必须填写。
  AccessLevel access = 50003;
}
