services:
  # 数据库是环境侧的独立基础设施（推荐 RDS PostgreSQL），不在本清单中启动。
  # 迁移由发布脚本显式执行，成功后才更新常驻服务。
  migrate:
    image: "${EAGLE_IMAGE:?EAGLE_IMAGE is required}"
    entrypoint: ["/app/migrate"]
    command: ["-dir", "/app/migrations"]
    env_file:
      - "${EAGLE_ENV_FILE:?EAGLE_ENV_FILE is required}"
    restart: "no"
    profiles: ["migration"]
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  eagle:
    image: "${EAGLE_IMAGE:?EAGLE_IMAGE is required}"
    env_file:
      - "${EAGLE_ENV_FILE:?EAGLE_ENV_FILE is required}"
    ports:
      - "${EAGLE_BIND_ADDRESS:-127.0.0.1}:${EAGLE_HTTP_PORT:-8000}:8000"
      - "${EAGLE_BIND_ADDRESS:-127.0.0.1}:${EAGLE_METRICS_PORT:-9101}:9100"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

