# 在受信任内网/TLS 终止层之后使用；管理与指标端口不能直接暴露公网。
global
    maxconn 2048

defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout check 3s

frontend eagle
    bind "${EAGLE_INGRESS_BIND}"
    default_backend eagle_app

backend eagle_app
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host eagle-health
    http-check expect status 200
    # 检查独立健康端口；连续两次失败停止向业务端口转发，连续两次成功恢复。
    server app "${EAGLE_UPSTREAM_HOST}:${EAGLE_UPSTREAM_PORT}" check port "${EAGLE_HEALTH_PORT}" inter 1s fall 2 rise 2
