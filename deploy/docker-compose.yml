name: eagle

x-eagle-build: &eagle-build
  context: ..
  args:
    VERSION: dev
    BUILDER_IMAGE: "${EAGLE_BUILDER_IMAGE:-mirror.gcr.io/library/golang:1.27-alpine}"
    RUNTIME_IMAGE: "${EAGLE_RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eagle
      POSTGRES_PASSWORD: eagle
      POSTGRES_DB: eagle
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eagle -d eagle"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_USER: eagle
      MYSQL_PASSWORD: eagle
      MYSQL_DATABASE: eagle
      MYSQL_ROOT_PASSWORD: eagle-root
    ports: ["3306:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-peagle-root"]
      interval: 5s
      timeout: 3s
      retries: 15

  # 迁移与服务是同一个镜像的两个 entrypoint：schema 与代码同版本发布，
  # 不会出现「服务已升级、迁移还没跑」的窗口。
  eagle-migrate:
    image: eagle/eagle:dev
    build: *eagle-build
    entrypoint: ["/app/migrate"]
    command: ["-dir", "/app/migrations"]
    environment:
      EAGLE_DATABASE_DRIVER: postgres
      EAGLE_DATABASE_DSN: postgres://eagle:eagle@postgres:5432/eagle?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  eagle:
    image: eagle/eagle:dev
    build: *eagle-build
    environment:
      EAGLE_DATABASE_DRIVER: postgres
      EAGLE_DATABASE_DSN: postgres://eagle:eagle@postgres:5432/eagle?sslmode=disable
      EAGLE_AUTH_SIGNING_KEY_DIRECTORY: /run/secrets/eagle-jwt
      EAGLE_AUTH_ACTIVE_SIGNING_KEY_ID: "${EAGLE_AUTH_ACTIVE_SIGNING_KEY_ID:-development-es256}"
      EAGLE_AUTH_GOOGLE_ENABLED: "${EAGLE_AUTH_GOOGLE_ENABLED:-false}"
      EAGLE_AUTH_GOOGLE_CLIENT_ID: "${EAGLE_AUTH_GOOGLE_CLIENT_ID:-}"
      EAGLE_AUTH_APPLE_ENABLED: "${EAGLE_AUTH_APPLE_ENABLED:-false}"
      EAGLE_AUTH_APPLE_CLIENT_ID: "${EAGLE_AUTH_APPLE_CLIENT_ID:-}"
    volumes:
      - ../configs/keys:/run/secrets/eagle-jwt:ro
    ports:
      - "${EAGLE_HTTP_PORT:-8000}:8000"
      - "${EAGLE_METRICS_PORT:-9101}:9100"
    depends_on:
      eagle-migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  mysqldata:
