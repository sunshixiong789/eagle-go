groups:
  - name: eagle-slo-recording
    interval: 30s
    rules:
      - record: eagle:server_requests:rate5m
        expr: sum by (service_name) (rate(server_requests_code_total[5m]))
      - record: eagle:server_errors:rate5m
        expr: sum by (service_name) (rate(server_requests_code_total{code=~"5.."}[5m]))
      - record: eagle:availability:ratio5m
        expr: 1 - (eagle:server_errors:rate5m / clamp_min(eagle:server_requests:rate5m, 0.001))
      - record: eagle:latency:p99_5m
        expr: histogram_quantile(0.99, sum by (service_name, le) (rate(server_requests_seconds_bucket[5m])))

  - name: eagle-slo-alerts
    rules:
      - alert: EagleServiceUnavailable
        expr: up{job="eagle-services"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Eagle service target is unavailable"
          description: "{{ $labels.instance }} has not been scraped for more than 2 minutes."

      - alert: EagleAvailabilityErrorBudgetFastBurn
        expr: |
          (
            sum by (service_name) (rate(server_requests_code_total{code=~"5.."}[5m]))
            / clamp_min(sum by (service_name) (rate(server_requests_code_total[5m])), 0.001)
          ) > (14.4 * 0.001)
          and
          (
            sum by (service_name) (rate(server_requests_code_total{code=~"5.."}[1h]))
            / clamp_min(sum by (service_name) (rate(server_requests_code_total[1h])), 0.001)
          ) > (14.4 * 0.001)
        for: 2m
        labels: {severity: critical, slo: availability-99.9}
        annotations:
          summary: "Availability SLO error budget is burning too fast"
          description: "{{ $labels.service_name }} is consuming the 30-day error budget at more than 14.4x."

      - alert: EagleP99LatencyHigh
        expr: eagle:latency:p99_5m > 2
        for: 10m
        labels: {severity: warning, slo: latency-p99}
        annotations:
          summary: "Eagle p99 latency is above 2 seconds"
          description: "{{ $labels.service_name }} p99 latency is {{ $value }} seconds."

      - alert: EagleRabbitMQBacklog
        expr: rabbitmq_queue_messages_ready{queue="eagle.admin.order-created.v1"} > 100
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Order-created notification queue is backing up"
          description: "RabbitMQ has {{ $value }} ready messages for the admin consumer."

      - alert: EagleRedisUnavailable
        expr: redis_up == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Redis cache is unavailable"
          description: "Product reads will fall back to PostgreSQL until Redis recovers."
