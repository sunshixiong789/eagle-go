global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 指标端口独立于业务端口，不经过认证鉴权中间件；生产环境只应在
  # 集群内部开放，并由 NetworkPolicy 限制为 Prometheus 可达。
  - job_name: eagle-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - admin:9100
          - product:9100
          - order:9100
