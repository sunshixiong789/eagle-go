global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # server 进程的指标端点。它独立于业务端口，不经过认证鉴权中间件——
  # Prometheus 不会带 token。
  #
  # host.docker.internal 让容器里的 Prometheus 能抓到跑在宿主机上的服务。
  # 服务本身也容器化之后，改成服务名即可。
  - job_name: eagle-server
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: eagle-server
