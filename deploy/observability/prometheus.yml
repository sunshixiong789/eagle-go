global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # 指标端口独立于业务端口，不经过认证鉴权中间件；生产环境只应在
  # 集群内部开放，并由 NetworkPolicy 限制为 Prometheus 可达。
  - job_name: eagle
    metrics_path: /metrics
    static_configs:
      - targets: ["eagle:9100"]
        labels: {service_name: eagle}
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
