events {}

http {
  # 与应用的 file.max_size_bytes（10MiB）保持一致。
  # 两边不一致时，超限请求会被网关以 nginx 默认的 HTML 413 拒绝，
  # 拿不到应用那套结构化错误响应，前端无法按 reason 分支处理。
  client_max_body_size 10m;

  server {
    listen 8000;

    # 单体只有一个上游，所有路由收敛到这里。
    # 需要灰度或拆分时，在这一层按前缀分流即可，客户端地址不变。
    location / {
      proxy_pass http://eagle:8000;
      include /etc/nginx/proxy.conf;
    }
  }
}
