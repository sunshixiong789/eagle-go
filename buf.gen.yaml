version: v2

# 统一生成 buf.yaml 中的 API 与内部配置模块。
# 插件版本由 tools/go.mod 固定，不依赖全局安装。
inputs:
  - directory: .

plugins:
  # 按 proto 的 go_package 定位输出目录，去掉业务 module 前缀。
  - local: ["go", "-C", "tools", "tool", "protoc-gen-go"]
    out: .
    opt: module=github.com/eagle-go/eagle

  # 只生成 HTTP；内部配置没有 service，不会生成 HTTP 桩或 OpenAPI 定义。
  - local: ["go", "-C", "tools", "tool", "protoc-gen-go-http"]
    out: .
    opt: module=github.com/eagle-go/eagle

  - local: ["go", "-C", "tools", "tool", "protoc-gen-openapi"]
    out: .
    strategy: all
    opt:
      - fq_schema_naming=true
      - default_response=false
