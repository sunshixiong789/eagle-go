version: v2

# 插件全部用 `go run` 拉起，不需要在机器上全局安装 protoc 插件——
# 版本随本文件走，团队成员和 CI 生成结果一致。
# 注意 protoc-gen-go-http 目前只有伪版本（v3 分支尚未打 semver tag），
# 官方 kratos-layout 自己也是 pin 伪版本，等上游打 tag 后再统一升。
inputs:
  - directory: api

plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: api
    opt: paths=source_relative

  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: api
    opt: paths=source_relative

  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-http/v3@v3.0.0-20260626125723-668db92c2c00"]
    out: api
    opt: paths=source_relative

  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-errors/v3@v3.0.0-20260626125723-668db92c2c00"]
    out: api
    opt: paths=source_relative

  - local: ["go", "run", "github.com/google/gnostic/cmd/protoc-gen-openapi@v0.7.1"]
    out: .
    strategy: all
    opt:
      - fq_schema_naming=true
      - default_response=false
