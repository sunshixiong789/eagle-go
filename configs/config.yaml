# eagle 后端服务本地开发配置。
#
# 生产环境不要直接改这个文件：敏感项（如 DSN 口令）应经由
# 环境变量或 Secret 注入，本文件只保留结构和安全的默认值。
#
# 【时长字段的写法】
# 所有 duration 都由 google.protobuf.Duration 承载，它只接受
# 「秒数 + s」这一种格式：3600s、0.5s。
# Go 风格的 1h / 30m / 500ms 一律解析失败，且会让服务在启动阶段
# 直接崩溃（见 config_test.go 中的回归测试）。

server:
  http:
    addr: "${SERVER_HTTP_ADDR:0.0.0.0:8000}"
    timeout: 5s

data:
  database:
    dsn: "${DATABASE_DSN:postgres://eagle:eagle@127.0.0.1:5432/eagle?sslmode=disable}"
    max_conns: 20
    max_idle_conns: 2
    max_conn_lifetime: 3600s
    max_conn_idle_time: 1800s

auth:
  # IdP 的 issuer，必须与 token 里的 iss 完全一致
  # （含协议、端口、是否带尾斜杠）。不一致时所有 token 都会因
  # iss 校验失败被拒，而报错信息不易定位到这里。
  # .example 是不可路由的文档域名；联调前必须覆盖为实际 IdP。
  issuer: "${AUTH_ISSUER:https://idp.example.com}"

  # 本服务在 IdP 中的 client id，
  # 用于从 client 角色 claim 里取出本服务的角色
  client_id: "${AUTH_CLIENT_ID:eagle-api}"

  # 期望的 aud；必须与 IdP 为本 API 签发的 audience 一致。
  audience: "${AUTH_AUDIENCE:eagle-api}"

  # 内外网地址不同时通过 EAGLE_AUTH_JWKS_URL 覆盖。
  jwks_url: "${AUTH_JWKS_URL:}"

  # JWKS 与角色 claim 没有跨 IdP 的统一路径，接入时按供应商文档覆盖。
  # jwks_url 非空时忽略 jwks_path；client_roles_claim 可以指向字符串数组，
  # 也可以指向按 client_id 分组的对象。
  jwks_path: "${AUTH_JWKS_PATH:/.well-known/jwks.json}"
  realm_roles_claim: "${AUTH_REALM_ROLES_CLAIM:}"
  client_roles_claim: "${AUTH_CLIENT_ROLES_CLAIM:roles}"

  # 仅本服务 client role 会触发短路；
  # 同名 realm role 不具备超管能力。
  super_admin_role: admin

observability:
  # OTLP trace 上报地址（gRPC，如 127.0.0.1:4317）。留空则不上报链路，
  # 只保留本地日志与指标；接入 collector 时通过环境变量覆盖。
  otlp_endpoint: "${OBSERVABILITY_OTLP_ENDPOINT:}"
  otlp_insecure: "${OBSERVABILITY_OTLP_INSECURE:true}"
  # 开发期全采样；生产建议降到 0.01~0.1
  trace_sample_ratio: "${OBSERVABILITY_TRACE_SAMPLE_RATIO:1.0}"
  log_level: "${OBSERVABILITY_LOG_LEVEL:info}"
  # 指标与健康检查端点，独立于业务端口且不经过鉴权
  metrics_addr: "${OBSERVABILITY_METRICS_ADDR:0.0.0.0:9101}"
