tags:
    - name: DictService
      description: |-
        DictService 管理数据字典。字典类型（sys_common_status）下挂若干字典项，
         前端下拉框、状态标签统一从这里取，避免枚举值散落在各处代码里。
    - name: PermissionService
    - name: RoleService
    - name: UserService
      description: |-
        UserService 管理系统用户及其角色绑定。
         每个方法都通过 eagle.annotations.v1.perm 声明所需权限码，
         由 pkg/authz 中间件统一拦截，handler 内不再手写鉴权。
