        eagle.dictionary.v1.CreateDictDataResponse:
            type: object
            properties:
                dictData:
                    $ref: '#/components/schemas/eagle.dictionary.v1.DictData'
        eagle.dictionary.v1.CreateDictTypeRequest:
            type: object
