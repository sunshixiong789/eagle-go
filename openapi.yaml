                        $ref: '#/components/schemas/eagle.access.v1.RoleInheritance'
                policyVersion:
                    type: string
                    description: 与返回列表一致的全局策略版本，空列表也返回版本。
        eagle.access.v1.Permission:
            type: object
            properties:
                id:
                    type: string
                parentId:
                    type: string
                    description: 父节点 ID；0 表示顶级节点。
                name:
                    type: string
                code:
                    type: string
                    description: 权限码，如 system:dict:add。目录/菜单可为空，按钮必填
                type:
                    type: integer
                    description: 1=目录 2=菜单 3=按钮
                    format: int32
                path:
                    type: string
                component:
                    type: string
                icon:
                    type: string
                sort:
                    type: integer
                    description: 同一父节点下按值升序排列，相同值按 id 升序排列。
                    format: int32
                visible:
                    type: boolean
                    description: 供前端使用的显示标记；GetMyMenus 不按此字段过滤。
                status:
                    type: integer
                    description: 0=停用，1=启用。
                    format: int32
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                revision:
                    type: string
                    description: 整棵权限树的版本，用于管理端乐观并发控制。
        eagle.access.v1.RoleBinding:
            type: object
            properties:
                role:
                    type: string
                    description: Eagle 分配的稳定角色键，如 user、admin、support-agent。
                permissionCodes:
                    type: array
                    items:
                        type: string
                    description: 角色的直接权限码，不展开继承；可包含末段通配码。
                revision:
                    type: string
                    description: 读取此绑定时的全局策略版本，可用作写入时的 expected_version。
            description: RoleBinding 是一个角色及其被授予的权限码。
        eagle.access.v1.RoleInheritance:
            type: object
            properties:
                child:
                    type: string
                parent:
                    type: string
        eagle.access.v1.SetRolePermissionsRequest:
            type: object
            properties:
                role:
                    type: string
                permissionCodes:
                    type: array
                    items:
                        type: string
                    description: 全量覆盖直接权限；未传或传空数组均清除直接授权，通过继承获得的权限保留。
                expectedVersion:
                    type: string
                    description: 预期的全局策略版本；未传时不检查，传入时必须与当前版本一致，否则拒绝写入。
        eagle.access.v1.SetRolePermissionsResponse:
            type: object
            properties:
                policyVersion:
                    type: string
                    description: 操作完成后的全局策略版本，可用于后续写入的并发检查。
        eagle.access.v1.UpdatePermissionRequest:
            type: object
            properties:
                id:
                    type: string
                parentId:
                    type: string
                    description: 父节点 ID；0 表示顶级节点。
                name:
                    type: string
                code:
                    type: string
                    description: 引用已登记且启用的具体权限码；目录或菜单可为空，按钮必填，不允许通配。
                type:
                    type: integer
                    description: 1=目录，2=菜单，3=按钮。
                    format: int32
                path:
                    type: string
                component:
                    type: string
                icon:
                    type: string
                sort:
                    type: integer
                    description: 同一父节点下按值升序排列，相同值按 id 升序排列。
                    format: int32
                visible:
                    type: boolean
                    description: 供前端使用的显示标记；GetMyMenus 不按此字段过滤，创建或更新时未传为 false。
                status:
                    type: integer
                    description: 0=停用，1=启用；创建或更新时未传按 0 处理。
                    format: int32
                expectedRevision:
                    type: string
                    description: 预期的整棵权限树版本；未传时不检查，传入时不匹配则拒绝写入。
        eagle.access.v1.UpdatePermissionResponse:
            type: object
            properties:
                permission:
                    $ref: '#/components/schemas/eagle.access.v1.Permission'
        eagle.auth.v1.GetJSONWebKeySetResponse:
            type: object
            properties:
                keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/eagle.auth.v1.JSONWebKey'
        eagle.auth.v1.JSONWebKey:
            type: object
            properties:
                kty:
                    type: string
                    description: 公钥类型：EC 或 RSA。
                use:
                    type: string
                    description: 公钥用途，sig 表示签名验证。
                alg:
                    type: string
                    description: 签名算法：ES256 或 RS256。
                kid:
                    type: string
                    description: 密钥标识，与 access token 头部的 kid 对应。
                crv:
                    type: string
                    description: EC 公钥的曲线名称；RSA 公钥不使用此字段。
                x:
                    type: string
                    description: EC 公钥 x 坐标的 Base64URL 编码；RSA 公钥不使用此字段。
                y:
                    type: string
                    description: EC 公钥 y 坐标的 Base64URL 编码；RSA 公钥不使用此字段。
                n:
                    type: string
                    description: RSA 公钥模数的 Base64URL 编码；EC 公钥不使用此字段。
                e:
                    type: string
                    description: RSA 公钥指数的 Base64URL 编码；EC 公钥不使用此字段。
        eagle.auth.v1.LogoutRequest:
            type: object
            properties:
                refreshToken:
                    type: string
                    description: 待撤销会话当前的刷新凭证；轮换前的旧凭证不能用于撤销。
        eagle.auth.v1.LogoutResponse:
            type: object
            properties: {}
        eagle.auth.v1.RefreshTokenRequest:
            type: object
            properties:
                refreshToken:
                    type: string
                    description: 当前会话最近一次签发的刷新凭证，成功刷新后须保存响应中的新凭证。
        eagle.auth.v1.SocialLoginRequest:
            type: object
            properties:
                provider:
                    type: integer
                    format: enum
                idToken:
                    type: string
                    description: 第三方 SDK 返回的 ID Token；服务端验证后签发 Eagle 令牌。
                nonce:
                    type: string
                    description: 发起第三方登录时使用的原始 nonce。Apple 原生 SDK 会在 token 中返回其 SHA-256 值。
                displayName:
                    type: string
                    description: Apple 仅在首次授权返回姓名，客户端应在首次交换时一并提交。
        eagle.auth.v1.TokenResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: Eagle 签发的访问令牌，供业务请求使用。
                refreshToken:
                    type: string
                    description: 当前会话的刷新凭证；刷新成功后替换本地保存的旧凭证。
                tokenType:
                    type: string
                    description: 认证方案，固定为 Bearer。
                expiresIn:
                    type: string
                    description: access token 的有效期，单位为秒。
                user:
                    $ref: '#/components/schemas/eagle.auth.v1.User'
        eagle.auth.v1.User:
            type: object
            properties:
                subject:
                    type: string
                    description: 与登录提供商无关、不可变且不透明的 Eagle 账号 ID，与 access token 的 sub 一致。
                provider:
                    type: integer
                    description: 本次会话使用的登录提供商。
                    format: enum
                email:
                    type: string
                emailVerified:
                    type: boolean
                displayName:
                    type: string
                avatarUrl:
                    type: string
                roles:
                    type: array
                    items:
                        type: string
                    description: Eagle 为该账号在当前 audience 下分配的角色，供授权判定使用。
        eagle.dictionary.v1.CreateDictDataRequest:
            type: object
            properties:
                dictType:
                    type: string
                    description: 所属类型的业务键，必须已存在，创建后不可修改。
                label:
                    type: string
                value:
                    type: string
                    description: 字典项业务值，同一类型内唯一。
                sort:
                    type: integer
                    description: 同一类型内按值升序排列，相同值按 id 升序排列。
                    format: int32
                cssClass:
                    type: string
                isDefault:
                    type: boolean
                    description: 供前端选择默认项的标记，未传为 false；服务端不保证同一类型只有一个默认项。
                status:
                    type: integer
                    description: 0=停用，1=启用；创建或更新时未传按 0 处理。
