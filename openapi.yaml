                    description: 唯一的类型业务键，创建后不可修改。
                status:
                    type: integer
                    description: 0=停用，1=启用；创建或更新时未传按 0 处理。
                    format: int32
                remark:
                    type: string
        eagle.dictionary.v1.CreateDictTypeResponse:
            type: object
            properties:
