tags:
    - name: AuthService
      description: AuthService 将第三方身份映射到 Eagle 账号，签发、刷新令牌并提供验签公钥。
    - name: DictService
      description: |-
        DictService 管理数据字典。字典类型（sys_common_status）下挂若干字典项，
         前端下拉框、状态标签统一从这里取，避免枚举值散落在各处代码里。
    - name: PermissionService
      description: PermissionService 管理目录、菜单和按钮节点，引用已有权限码，并提供当前主体的导航视图。
    - name: RoleBindingService
      description: |-
        RoleBindingService 管理 Eagle 角色的直接权限与继承关系。
         用户到角色的归属由 auth 模块维护，并通过 Eagle token 携带。
         策略写入成功后同步重载本实例，其他实例通过后台对账同步。
         若提交后本实例重载失败，请求会返回错误，但策略写入已生效于存储，应重新查询确认。
